name: Daily Prospecting Pipeline

on:
  schedule:
    - cron: '0 8 * * *'  # 8 AM UTC daily
  workflow_dispatch:     # Allow manual trigger via GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t outreach-pipeline:latest .

      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: |
          docker run --rm \
            -e DATABASE_URL \
            -e APIFY_API_TOKEN \
            -e HUNTER_API_KEY \
            -e DEEPSEEK_API_KEY \
            -e EMAIL_ADDRESS \
            -e EMAIL_APP_PASSWORD \
            outreach-pipeline:latest

      - name: Log pipeline result
        if: always()
        run: |
          if [ $? -eq 0 ]; then
            echo "✓ Pipeline completed successfully"
          else
            echo "✗ Pipeline failed; check logs above"
          fi
